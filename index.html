<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Un jeu de clic où vous devez miner des diamants et acheter des producteurs pour augmenter votre production.">
    <title>💎 MindMine Clicker</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Section de jeu (gauche) -->
        <div class="game-section">
            <h1>💎 MindMine Clicker</h1>
            <div id="score">Diamants : <span id="diamond-count">0</span></div>
            <div id="click-area">
                <button id="click-btn">
                    <img id="pickaxe" src="./assets/images/pickaxe_wood.png" alt="Pioche">
                </button>
                <img id="diamond" src="./assets/images/diamond.png" alt="Diamant">
            </div>
            <div class="log" id="log"></div>
        </div>

        <!-- Section boutique (droite) -->
        <div class="shop-section">
            <h2>🏭 Producteurs</h2>
            <div id="producers-container">
                <!-- Rempli dynamiquement par shopManager.js -->
            </div>
            <h2>⚡ Améliorations</h2>
            <div id="boosts-container">
                <!-- Rempli dynamiquement par shopManager.js -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/gameManager.js"></script>
    <script src="./js/shopManager.js"></script>
    <script src="./js/animationUpgrade.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
